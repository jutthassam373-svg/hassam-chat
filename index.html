<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1c">
<title>HASSAM CHAT</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#080d1c;
 color:white;
}
header{
 background:#111a30;
 padding:18px;
 text-align:center;
 border-bottom:1px solid #263858;
}
header h1{margin:0;color:#38d9ff}
.container{
 max-width:850px;
 margin:20px auto;
 padding:15px;
}
.card{
 background:#111a30;
 padding:20px;
 border-radius:14px;
 margin-bottom:15px;
 border:1px solid #263858;
}
input,button{
 width:100%;
 padding:13px;
 margin:7px 0;
 border-radius:8px;
 border:none;
 font-size:15px;
}
input{background:#202c45;color:white}
button{
 background:#08b9e8;
 color:#00111b;
 font-weight:bold;
 cursor:pointer;
}
button:hover{background:#42d7ff}
.secondary{background:#35435f;color:white}
.danger{background:#a93232;color:white}
.hidden{display:none}
#chatBox{
 height:300px;
 overflow-y:auto;
 background:#080f20;
 padding:12px;
 border-radius:10px;
}
.msg{
 background:#1d3150;
 padding:10px;
 border-radius:10px;
 margin:8px 0;
 max-width:85%;
 overflow-wrap:anywhere;
}
.mine{
 background:#075b78;
 margin-left:auto;
}
.small{font-size:12px;color:#aabbd4}
.contact{
 padding:12px;
 background:#202c45;
 border-radius:8px;
 margin:8px 0;
 cursor:pointer;
}
.contact:hover{background:#304363}
.status{color:#38d9ff}
</style>
</head>

<body>

<header>
<h1>HASSAM CHAT</h1>
<p>Connect • Chat • Share</p>
</header>

<div class="container">

<div class="card" id="authBox">
<h2>Welcome to HASSAM CHAT</h2>

<input id="email" type="email" placeholder="Your Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button class="secondary" onclick="signup()">Create New Account</button>

<p id="authStatus" class="small"></p>
</div>

<div id="appBox" class="hidden">

<div class="card">
<h2>Welcome to HASSAM CHAT</h2>
<p>Your HASSAM ID:</p>
<h2 class="status" id="myId">Loading...</h2>
<button class="secondary" onclick="logout()">Logout</button>
<button onclick="installApp()" id="installBtn" class="hidden">
📲 Install HASSAM CHAT
</button>
</div>

<div class="card">
<h3>➕ Add New Contact</h3>
<input id="contactId" placeholder="Enter HASSAM ID">
<button onclick="addContact()">Add Contact</button>
<p id="contactStatus" class="small"></p>
</div>

<div class="card">
<h3>👥 Contacts</h3>
<div id="contacts">No contacts added yet.</div>
</div>

<div class="card" id="chatArea">
<h3 id="chatTitle">Select a contact to start chatting</h3>

<div id="chatBox">
Your online chat will appear here.
</div>

<input id="messageInput" placeholder="Type your message..." disabled>
<button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
<p id="chatStatus" class="small"></p>
</div>

</div>
</div>

<script>
const SUPABASE_URL =
"https://yggxqcinxphommhscoyt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QrZdIxrSJEW72nmiBkwNuQ_55iBU0yD";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser = null;
let myProfile = null;
let selectedContact = null;
let contacts = [];
let realtimeChannel = null;

const $ = id => document.getElementById(id);

function status(id,text){
 $(id).textContent = text;
}

async function login(){
 const email = $("email").value.trim();
 const password = $("password").value;

 if(!email || !password){
  status("authStatus","Email aur password likho.");
  return;
 }

 status("authStatus","Logging in...");

 const {error} = await db.auth.signInWithPassword({
  email,password
 });

 if(error){
  status("authStatus",error.message);
  return;
 }

 await startApp();
}

async function signup(){
 const email = $("email").value.trim();
 const password = $("password").value;

 if(!email || password.length < 6){
  status("authStatus","Valid email aur kam az kam 6 characters ka password likho.");
  return;
 }

 status("authStatus","Account ban raha hai...");

 const {data,error} = await db.auth.signUp({
  email,
  password,
  options:{
   data:{display_name:email.split("@")[0]}
  }
 });

 if(error){
  status("authStatus",error.message);
  return;
 }

 if(!data.session){
  status("authStatus","Account ban gaya! Email confirmation ke baad login karo.");
  return;
 }

 await startApp();
}

async function startApp(){
 const {data,error} = await db.auth.getUser();

 if(error || !data.user){
  status("authStatus","Login session nahi mili.");
  return;
 }

 currentUser = data.user;

 $("authBox").classList.add("hidden");
 $("appBox").classList.remove("hidden");

 await loadProfile();
}

async function loadProfile(){
 status("chatStatus","Profile load ho rahi hai...");

 const {data,error} = await db
  .from("profiles")
  .select("*")
  .eq("id",currentUser.id)
  .maybeSingle();

 if(error){
  status("myId","Profile Error");
  status("chatStatus",error.message);
  return;
 }

 if(!data){
  status("myId","Profile nahi mili");
  status("chatStatus","Supabase profiles table mein tumhara record nahi mila.");
  return;
 }

 myProfile = data;
 status("myId",data.user_id);

 loadContacts();
 startRealtime();
}

function getSavedContacts(){
 try{
  return JSON.parse(
   localStorage.getItem("hj_contacts_"+currentUser.id)
  ) || [];
 }catch(e){
  return [];
 }
}

function saveContacts(){
 localStorage.setItem(
  "hj_contacts_"+currentUser.id,
  JSON.stringify(contacts)
 );
}

async function loadContacts(){
 contacts = getSavedContacts();
 renderContacts();
}

function renderContacts(){
 const box = $("contacts");
 box.innerHTML = "";

 if(!contacts.length){
  box.textContent = "No contacts added yet.";
  return;
 }

 contacts.forEach(c=>{
  const div = document.createElement("div");
  div.className = "contact";
  div.textContent = "💬 " + c.display_name +
   " (" + c.user_id + ")";

  div.onclick = ()=>openChat(c);
  box.appendChild(div);
 });
}

async function addContact(){
 const id = $("contactId").value.trim().toUpperCase();

 if(!id){
  status("contactStatus","HASSAM ID likho.");
  return;
 }

 if(id === myProfile.user_id){
  status("contactStatus","Apni ID add nahi kar sakte.");
  return;
 }

 status("contactStatus","Contact search ho raha hai...");

 const {data,error} = await db
  .from("profiles")
  .select("id,user_id,display_name")
  .eq("user_id",id)
  .maybeSingle();

 if(error){
  status("contactStatus",error.message);
  return;
 }

 if(!data){
  status("contactStatus","Ye HASSAM ID nahi mili.");
  return;
 }

 if(contacts.some(c=>c.id===data.id)){
  status("contactStatus","Contact pehle se added hai.");
  return;
 }

 contacts.push(data);
 saveContacts();
 renderContacts();

 $("contactId").value = "";
 status("contactStatus","Contact successfully added!");
}

async function openChat(contact){
 selectedContact = contact;

 $("chatTitle").textContent =
 "Chat with " + contact.display_name;

 $("messageInput").disabled = false;
 $("sendBtn").disabled = false;

 await loadMessages();
}

async function loadMessages(){
 if(!selectedContact) return;

 status("chatStatus","Messages load ho rahe hain...");

 const a = currentUser.id;
 const b = selectedContact.id;

 const {data,error} = await db
  .from("messages")
  .select("*")
  .or(
   `and(sender_id.eq.${a},receiver_id.eq.${b}),and(sender_id.eq.${b},receiver_id.eq.${a})`
  )
  .order("created_at",{ascending:true});

 if(error){
  status("chatStatus","Messages load nahi ho sake: "+error.message);
  return;
 }

 const box = $("chatBox");
 box.innerHTML = "";

 if(!data.length){
  box.textContent = "Abhi koi message nahi. Pehla message bhejo!";
  return;
 }

 data.forEach(m=>showMessage(m));

 box.scrollTop = box.scrollHeight;
 status("chatStatus","");
}

function showMessage(m){
 const box = $("chatBox");

 const div = document.createElement("div");
 div.className = "msg";

 if(m.sender_id === currentUser.id){
  div.classList.add("mine");
 }

 const text = document.createElement("div");
 text.textContent = m.content;

 const time = document.createElement("div");
 time.className = "small";
 time.textContent = new Date(m.created_at).toLocaleString();

 div.appendChild(text);
 div.appendChild(time);
 box.appendChild(div);

 box.scrollTop = box.scrollHeight;
}

async function sendMessage(){
 if(!selectedContact) return;

 const content = $("messageInput").value.trim();

 if(!content) return;

 $("sendBtn").disabled = true;

 const {data,error} = await db
  .from("messages")
  .insert({
   sender_id:currentUser.id,
   receiver_id:selectedContact.id,
   content:content
  })
  .select()
  .single();

 $("sendBtn").disabled = false;

 if(error){
  status("chatStatus","Message send nahi hua: "+error.message);
  return;
 }

 $("messageInput").value = "";
 showMessage(data);
 status("chatStatus","Message sent!");
}

function startRealtime(){
 if(realtimeChannel){
  db.removeChannel(realtimeChannel);
 }

 realtimeChannel = db
  .channel("messages-"+currentUser.id)
  .on(
   "postgres_changes",
   {
    event:"INSERT",
    schema:"public",
    table:"messages"
   },
   payload=>{
    const m = payload.new;

    if(!selectedContact) return;

    const belongs =
     (m.sender_id===currentUser.id &&
      m.receiver_id===selectedContact.id) ||
     (m.sender_id===selectedContact.id &&
      m.receiver_id===currentUser.id);

    if(belongs){
     loadMessages();
    }
   }
  )
  .subscribe();
}

async function logout(){
 if(realtimeChannel){
  await db.removeChannel(realtimeChannel);
 }

 await db.auth.signOut();
 location.reload();
}

$("messageInput").addEventListener("keydown",e=>{
 if(e.key==="Enter") sendMessage();
});

let installPrompt = null;

window.addEventListener("beforeinstallprompt",e=>{
 e.preventDefault();
 installPrompt = e;
 $("installBtn").classList.remove("hidden");
});

async function installApp(){
 if(!installPrompt){
  alert("Chrome menu se Install page as app try karo.");
  return;
 }

 installPrompt.prompt();
 await installPrompt.userChoice;
 installPrompt = null;
 $("installBtn").classList.add("hidden");
}

if("serviceWorker" in navigator){
 navigator.serviceWorker.register("./sw.js")
  .catch(err=>console.log("SW:",err));
}

db.auth.getSession().then(({data})=>{
 if(data.session) startApp();
});
</script>

</body>
</html>
