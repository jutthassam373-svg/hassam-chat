<!DOCTYPE html>
<html lang="en">
<head>
 <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075e54">
<title>HASSAM CHAT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,sans-serif;
 background:#dce5e1;
 height:100vh;
 overflow:hidden;
}
.app{
 display:flex;
 height:100vh;
 max-width:1500px;
 margin:auto;
 background:white;
 box-shadow:0 0 25px #0002;
}
.sidebar{
 width:370px;
 min-width:300px;
 background:#fff;
 border-right:1px solid #ddd;
 display:flex;
 flex-direction:column;
}
.header{
 height:65px;
 background:#075e54;
 color:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 18px;
}
.logo{font-size:21px;font-weight:bold;letter-spacing:1px}
.header button{
 background:none;border:0;color:white;
 font-size:21px;cursor:pointer;margin-left:13px;
}
.search{padding:12px;background:#f5f6f6}
.search input{
 width:100%;padding:12px 15px;border:0;
 outline:0;border-radius:9px;background:white;
}
.chat-list{overflow-y:auto;flex:1}
.chat-item{
 display:flex;align-items:center;gap:12px;
 padding:14px 13px;border-bottom:1px solid #eee;
 cursor:pointer;transition:.2s;
}
.chat-item:hover,.chat-item.active{background:#e9f5f1}
.avatar{
 width:48px;height:48px;border-radius:50%;
 background:#128c7e;color:white;
 display:grid;place-items:center;
 font-size:19px;font-weight:bold;flex-shrink:0;
}
.chat-info{flex:1;min-width:0}
.chat-info h3{font-size:15px;margin-bottom:6px}
.chat-info p{font-size:12px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:10px;color:#888}
.main{
 flex:1;display:flex;flex-direction:column;
 min-width:0;background:#efeae2;
}
.welcome{
 flex:1;display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 text-align:center;color:#54656f;padding:20px;
}
.welcome .big{font-size:75px;margin-bottom:20px}
.welcome h1{font-size:30px;font-weight:400;margin-bottom:12px}
.welcome p{line-height:1.6;font-size:14px}
.chat-header{
 height:65px;background:#f0f2f5;
 display:flex;align-items:center;padding:0 18px;gap:12px;
 border-bottom:1px solid #ddd;
}
.chat-header h3{font-size:16px}
.chat-header small{color:#128c7e}
.messages{
 flex:1;overflow-y:auto;padding:22px;
 display:flex;flex-direction:column;gap:12px;
 background-color:#efeae2;
 background-image:radial-gradient(#b7aaa0 0.5px,transparent 0.5px);
 background-size:18px 18px;
}
.msg{
 max-width:75%;padding:10px 12px;border-radius:9px;
 font-size:14px;line-height:1.5;word-wrap:break-word;
 box-shadow:0 1px 2px #0001;
}
.sent{align-self:flex-end;background:#d9fdd3}
.received{align-self:flex-start;background:white}
.msg time{display:block;text-align:right;font-size:10px;color:#777;margin-top:4px}
.input-area{
 display:flex;gap:10px;padding:12px;
 background:#f0f2f5;align-items:center;
}
.input-area input{
 flex:1;padding:14px;border:0;border-radius:25px;
 outline:none;font-size:14px;min-width:0;
}
.send{
 background:#128c7e;color:white;border:0;
 width:45px;height:45px;border-radius:50%;
 font-size:20px;cursor:pointer;
}
.add{
 background:#128c7e;color:white;border:0;
 padding:10px 14px;border-radius:8px;
 cursor:pointer;font-weight:bold;
}
.empty{padding:30px;text-align:center;color:#888}
.modal-bg{
 position:fixed;inset:0;background:#0008;
 display:none;align-items:center;justify-content:center;
 z-index:10;padding:20px;
}
.modal{
 background:white;padding:25px;border-radius:15px;
 width:100%;max-width:350px;
}
.modal h2{margin-bottom:18px}
.modal input{
 width:100%;padding:12px;margin-bottom:12px;
 border:1px solid #ddd;border-radius:7px;
}
.modal button{margin-right:6px}
.dark{background:#111;color:#eee}
.dark .sidebar,.dark .modal{background:#202c33;color:white}
.dark .chat-item{border-color:#39454d}
.dark .chat-item:hover,.dark .chat-item.active{background:#35444d}
.dark .chat-header,.dark .input-area,.dark .search{background:#202c33}
.dark .search input,.dark .input-area input{background:#35444d;color:white}
.dark .messages{background:#0b141a;background-image:none}
.dark .received{background:#202c33;color:white}
.dark .welcome{color:#ddd}
@media(max-width:650px){
 .sidebar{width:100%;min-width:0}
 .main{display:none}
 .app.open-chat .sidebar{display:none}
 .app.open-chat .main{display:flex;width:100%}
 .chat-header:before{
  content:"‹";font-size:32px;color:#075e54;
  cursor:pointer;margin-right:5px;
 }
 .msg{max-width:88%}
}
</style>
</head>

<body>
<div class="app" id="app">

<aside class="sidebar">
 <div class="header">
  <div class="logo">💬 HASSAM CHAT</div>
  <div>
   <button onclick="newChat()" title="Add contact">＋</button>
   <button onclick="toggleDark()" title="Dark mode">☾</button>
   <button id="installBtn" style="display:none" title="Install App">⬇</button>
  </div>
 </div>

 <div class="search">
  <input id="search" placeholder="🔍 Search chats..." oninput="renderChats()">
 </div>

 <div class="chat-list" id="chatList"></div>
</aside>

<main class="main" id="main">
 <div class="welcome" id="welcome">
  <div class="big">💬</div>
  <h1>HASSAM CHAT</h1>
  <p>Your Private Chat Space<br><br>
  Select a contact to start chatting.<br>
  Your messages are saved on this device.</p>
 </div>

 <div id="chatScreen" style="display:none;flex:1;flex-direction:column;min-height:0">
  <div class="chat-header">
   <div class="avatar" id="chatAvatar">H</div>
   <div>
    <h3 id="chatName">Contact</h3>
    <small>Offline chat</small>
   </div>
  </div>

  <div class="messages" id="messages"></div>

  <form class="input-area" onsubmit="sendMessage(event)">
   <input id="messageInput" placeholder="Type a message..." autocomplete="off">
   <button class="send" type="submit">➤</button>
  </form>
 </div>
</main>
</div>

<div class="modal-bg" id="modal">
 <div class="modal">
  <h2>New Contact</h2>
  <input id="contactName" placeholder="Enter contact name">
  <button class="add" onclick="createContact()">Create</button>
  <button class="add" style="background:#777" onclick="closeModal()">Cancel</button>
 </div>
</div>

<script>
let contacts = JSON.parse(localStorage.getItem("hassam_contacts") || "[]");
let current = null;

function save(){
 localStorage.setItem("hassam_contacts",JSON.stringify(contacts));
}

function renderChats(){
 const list=document.getElementById("chatList");
 const query=document.getElementById("search").value.toLowerCase();
 list.innerHTML="";

 const filtered=contacts.filter(c=>c.name.toLowerCase().includes(query));

 if(filtered.length===0){
  list.innerHTML='<div class="empty">No chats yet.<br>Press + to add a contact.</div>';
  return;
 }

 filtered.forEach(c=>{
  const last=c.messages[c.messages.length-1];
  const item=document.createElement("div");
  item.className="chat-item "+(current===c.id?"active":"");
  item.innerHTML=`
   <div class="avatar">${escapeHTML(c.name.charAt(0).toUpperCase())}</div>
   <div class="chat-info">
    <h3>${escapeHTML(c.name)}</h3>
    <p>${last?escapeHTML(last.text):"Start a new conversation"}</p>
   </div>
   <div class="chat-time">${last?last.time:""}</div>`;
  item.onclick=()=>openChat(c.id);
  list.appendChild(item);
 });
}

function escapeHTML(text){
 return String(text).replace(/[&<>"']/g,ch=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[ch]));
}

function newChat(){
 document.getElementById("modal").style.display="flex";
 document.getElementById("contactName").value="";
 document.getElementById("contactName").focus();
}

function closeModal(){
 document.getElementById("modal").style.display="none";
}

function createContact(){
 const name=document.getElementById("contactName").value.trim();
 if(!name){alert("Please enter a name.");return;}

 const existing=contacts.find(c=>c.name.toLowerCase()===name.toLowerCase());
 if(existing){openChat(existing.id);closeModal();return;}

 const contact={
  id:Date.now(),
  name:name,
  messages:[]
 };
 contacts.unshift(contact);
 save();
 closeModal();
 renderChats();
 openChat(contact.id);
}

function openChat(id){
 current=id;
 const c=contacts.find(x=>x.id===id);
 if(!c)return;

 document.getElementById("welcome").style.display="none";
 document.getElementById("chatScreen").style.display="flex";
 document.getElementById("chatName").textContent=c.name;
 document.getElementById("chatAvatar").textContent=c.name.charAt(0).toUpperCase();

 document.getElementById("app").classList.add("open-chat");
 renderMessages();
 renderChats();
}

function renderMessages(){
 const c=contacts.find(x=>x.id===current);
 if(!c)return;

 const box=document.getElementById("messages");
 box.innerHTML="";

 c.messages.forEach(m=>{
  const div=document.createElement("div");
  div.className="msg sent";
  div.innerHTML=escapeHTML(m.text)+"<time>"+m.time+"</time>";
  box.appendChild(div);
 });
 box.scrollTop=box.scrollHeight;
}

function sendMessage(event){
 event.preventDefault();
 const input=document.getElementById("messageInput");
 const text=input.value.trim();
 if(!text||current===null)return;

 const c=contacts.find(x=>x.id===current);
 c.messages.push({
  text:text,
  time:new Date().toLocaleTimeString([],{
   hour:"2-digit",minute:"2-digit"
  })
 });

 save();
 input.value="";
 renderMessages();
 renderChats();
}

function toggleDark(){
 document.body.classList.toggle("dark");
 localStorage.setItem("hassam_dark",
  document.body.classList.contains("dark")?"yes":"no");
}

if(localStorage.getItem("hassam_dark")==="yes"){
 document.body.classList.add("dark");
}

renderChats();
</script>
 <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js")
      .then(function () {
        console.log("HASSAM CHAT Offline Ready!");
      })
      .catch(function (error) {
        console.log("Offline Error:", error);
      });
  });
}
</script>
</body>
</html>
