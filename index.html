<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>HASSAM CHAT</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#07111f;color:white;
 font-family:Arial,sans-serif;
}
button,input{font:inherit}
button{
 background:#08c9c9;color:#001b22;border:0;
 padding:12px 16px;border-radius:9px;
 cursor:pointer;font-weight:bold;
}
input{
 width:100%;padding:13px;margin:7px 0;
 background:#142438;color:white;
 border:1px solid #29425c;border-radius:9px;
}
header{
 padding:18px;background:#0d1d30;
 display:flex;justify-content:space-between;
 align-items:center;border-bottom:1px solid #23394f;
}
header h2{margin:0;color:#12d9d9}
.container{max-width:850px;margin:auto;padding:15px}
.card{
 background:#102238;padding:20px;
 border-radius:14px;margin-top:20px;
}
.hidden{display:none!important}
#contacts button{
 display:block;width:100%;margin:8px 0;
 text-align:left;background:#19334d;color:white;
}
#messages{
 height:55vh;overflow-y:auto;
 background:#091827;padding:12px;
 border-radius:12px;margin:12px 0;
}
.msg{
 background:#193c52;padding:11px;
 border-radius:12px;margin:8px 0;
 max-width:80%;overflow-wrap:anywhere;
}
.mine{background:#087f83;margin-left:auto}
.small{font-size:12px;color:#a8bacb}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
#status{color:#18dddd}
footer{text-align:center;color:#8fa6bb;padding:20px}
</style>
</head>

<body>

<header>
<h2>💬 HASSAM CHAT</h2>
<div class="row">
<button id="installBtn" class="hidden">⬇ Install</button>
<button onclick="toggleDark()">☾</button>
</div>
</header>

<div class="container">

<!-- AUTH -->
<section id="auth" class="card">
<h2>💬 HASSAM CHAT</h2>
<p>Create your account or log in</p>

<input id="email" type="email" placeholder="Your Email">
<input id="password" type="password" placeholder="Password">

<div class="row">
<button onclick="signup()">Create Account</button>
<button onclick="login()">Log In</button>
</div>

<p id="authStatus"></p>
</section>

<!-- APP -->
<section id="app" class="hidden">

<div class="card">
<h3>Welcome to HASSAM CHAT</h3>
<p>Your HASSAM ID: <b id="myId">Loading...</b></p>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>➕ Add New Contact</h3>
<input id="friendId" placeholder="Enter Friend HASSAM ID">
<button onclick="addContact()">Add Contact</button>
<p id="contactStatus"></p>
</div>

<div class="card">
<h3>👥 Contacts</h3>
<div id="contacts">No contacts added yet.</div>
</div>

<div class="card">
<h3 id="chatTitle">Select a contact to start chatting</h3>
<div id="messages">
<p class="small">Your online chat will appear here.</p>
</div>

<div class="row">
<input id="messageInput" placeholder="Write a message..." onkeydown="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">Send</button>
</div>
</div>

</section>
</div>

<footer>
Made with ❤️ by HASSAM JUTT
</footer>

<script>
const SUPABASE_URL = "https://yggxqcinxphommhscoyt.supabase.co";

const SUPABASE_KEY = "sb_publishable_QrZdIxrSJEW72nmiBkwNuQ_55iBU0yD";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser = null;
let myProfile = null;
let activeFriend = null;
let contacts = [];
let realtimeChannel = null;

const $ = id => document.getElementById(id);

function showStatus(message){
 $("authStatus").textContent = message;
}

async function signup(){
 const email = $("email").value.trim();
 const password = $("password").value;

 if(!email || password.length < 8){
  showStatus("Email likho aur password kam az kam 8 characters ka rakho.");
  return;
 }

 showStatus("Account ban raha hai...");

 const {data,error} = await db.auth.signUp({
  email,
  password,
  options:{
   emailRedirectTo:location.origin + location.pathname
  }
 });

 if(error){
  showStatus(error.message);
  return;
 }

 if(data.session){
  await startApp(data.session.user);
 }else{
  showStatus("Apni email inbox verify karo, phir Log in karo.");
 }
}

async function login(){
 const email = $("email").value.trim();
 const password = $("password").value;

 if(!email || !password){
  showStatus("Email aur password dono likho.");
  return;
 }

 showStatus("Logging in...");

 const {data,error} = await db.auth.signInWithPassword({
  email,password
 });

 if(error){
  showStatus(error.message);
  return;
 }

 await startApp(data.user);
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function startApp(user){
 currentUser = user;

 $("auth").classList.add("hidden");
 $("app").classList.remove("hidden");

 await loadProfile();

 if(!myProfile){
  alert("Profile nahi mili. Supabase profile trigger check karo.");
  return;
 }

 $("myId").textContent = myProfile.user_id;

 loadContacts();
 startRealtime();
}

async function loadProfile(){
 const {data,error} = await db
  .from("profiles")
  .select("*")
  .eq("id",currentUser.id)
  .maybeSingle();

 if(error){
  console.error(error);
  return;
 }

 myProfile = data;
}

function contactStorageKey(){
 return "hassam_contacts_" + currentUser.id;
}

function loadContacts(){
 contacts = JSON.parse(
  localStorage.getItem(contactStorageKey()) || "[]"
 );

 renderContacts();
}

function saveContacts(){
 localStorage.setItem(
  contactStorageKey(),
  JSON.stringify(contacts)
 );
}

function renderContacts(){
 const box = $("contacts");
 box.innerHTML = "";

 if(!contacts.length){
  box.textContent = "No contacts added yet.";
  return;
 }

 contacts.forEach(friend=>{
  const btn = document.createElement("button");
  btn.textContent = "💬 " + friend.display_name +
   " (" + friend.user_id + ")";

  btn.onclick = ()=>openChat(friend);
  box.appendChild(btn);
 });
}

async function addContact(){
 const id = $("friendId").value.trim().toUpperCase();

 if(!id){
  $("contactStatus").textContent = "HASSAM ID likho.";
  return;
 }

 if(id === myProfile.user_id){
  $("contactStatus").textContent = "Apni ID add nahi kar sakte.";
  return;
 }

 const {data,error} = await db
  .from("profiles")
  .select("id,user_id,display_name")
  .eq("user_id",id)
  .maybeSingle();

 if(error){
  $("contactStatus").textContent = error.message;
  return;
 }

 if(!data){
  $("contactStatus").textContent = "Ye HASSAM ID nahi mili.";
  return;
 }

 if(contacts.some(c=>c.id===data.id)){
  $("contactStatus").textContent = "Ye contact pehle se added hai.";
  return;
 }

 contacts.push(data);
 saveContacts();
 renderContacts();

 $("friendId").value = "";
 $("contactStatus").textContent = "Contact successfully added!";
}

async function openChat(friend){
 activeFriend = friend;

 $("chatTitle").textContent =
  "💬 " + friend.display_name + " (" + friend.user_id + ")";

 await loadMessages();
}

async function loadMessages(){
 if(!activeFriend) return;

 const {data,error} = await db
  .from("messages")
  .select("*")
  .or(
   `and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeFriend.id}),and(sender_id.eq.${activeFriend.id},receiver_id.eq.${currentUser.id})`
  )
  .order("created_at",{ascending:true});

 if(error){
  console.error(error);
  $("messages").textContent = "Messages load nahi ho sake: " + error.message;
  return;
 }

 const box = $("messages");
 box.innerHTML = "";

 if(!data.length){
  box.textContent = "Abhi koi message nahi. Pehla message bhejo!";
  return;
 }

 data.forEach(message=>{
  const div = document.createElement("div");
  div.className = "msg " +
   (message.sender_id===currentUser.id ? "mine" : "");

  const text = document.createElement("div");
  text.textContent = message.content;

  const time = document.createElement("div");
  time.className = "small";
  time.textContent = new Date(message.created_at)
   .toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});

  div.appendChild(text);
  div.appendChild(time);
  box.appendChild(div);
 });

 box.scrollTop = box.scrollHeight;
}

async function sendMessage(){
 if(!activeFriend){
  alert("Pehle contact select karo.");
  return;
 }

 const content = $("messageInput").value.trim();
 if(!content) return;

 $("messageInput").value = "";

 const {error} = await db.from("messages").insert({
  sender_id:currentUser.id,
  receiver_id:activeFriend.id,
  content:content
 });

 if(error){
  alert("Message send nahi hua: " + error.message);
  $("messageInput").value = content;
  return;
 }

 await loadMessages();
}

function startRealtime(){
 if(realtimeChannel){
  db.removeChannel(realtimeChannel);
 }

 realtimeChannel = db
  .channel("hassam-chat-" + currentUser.id)
  .on(
   "postgres_changes",
   {
    event:"INSERT",
    schema:"public",
    table:"messages"
   },
   payload=>{
    const msg = payload.new;

    if(
     activeFriend &&
     (
      (msg.sender_id===currentUser.id &&
       msg.receiver_id===activeFriend.id) ||
      (msg.sender_id===activeFriend.id &&
       msg.receiver_id===currentUser.id)
     )
    ){
     loadMessages();
    }
   }
  )
  .subscribe();
}

function toggleDark(){
 document.body.classList.toggle("light");

 if(document.body.classList.contains("light")){
  document.body.style.background="#e8f0f7";
  document.body.style.color="#102238";
 }else{
  document.body.style.background="#07111f";
  document.body.style.color="white";
 }
}

// Existing login session check
(async()=>{
 const {data} = await db.auth.getSession();

 if(data.session){
  await startApp(data.session.user);
 }
})();

// PWA INSTALL BUTTON
let installPrompt = null;

window.addEventListener("beforeinstallprompt",event=>{
 event.preventDefault();
 installPrompt = event;
 $("installBtn").classList.remove("hidden");
});

$("installBtn").addEventListener("click",async()=>{
 if(!installPrompt){
  alert("Chrome menu se Install App ya Add to Home Screen select karo.");
  return;
 }

 installPrompt.prompt();
 await installPrompt.userChoice;
 installPrompt = null;
 $("installBtn").classList.add("hidden");
});

window.addEventListener("appinstalled",()=>{
 $("installBtn").classList.add("hidden");
 alert("HASSAM CHAT successfully installed!");
});

// Service worker
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./service-worker.js")
   .catch(error=>console.log("Service worker:",error));
 });
}
</script>

</body>
</html>
